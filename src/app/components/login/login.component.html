<div class="login-container">
  <div class="left-section">
    <img src="/assets/images/location_icon.svg" alt="Location Icon" />
  </div>
  <div class="vertical-line"></div>

  <div class="right-section">
    <h2 style="color: white;">RTLS</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <div class="input-container">
        <img src="/assets/images/email-icon.svg" alt="Email Icon" />
        <input
          formControlName="email"
          type="email"
          placeholder="E-mail"
        />
      </div>
      <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" style="color: red;">
        <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</small>
        <small *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email</small>
      </div>

      <div class="input-container">
        <img src="/assets/images/password-icon.svg" alt="Password Icon" />
        <input
          formControlName="password"
          type="password"
          placeholder="Password"
        />
      </div>
      <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" style="color: red;">
        <small>Password is required</small>
      </div>

      <button type="submit" [disabled]="loginForm.invalid">LOGIN</button>
    </form>

    <div *ngIf="errorMessage" style="color: red; font-weight: bold;">
      {{ errorMessage }}
    </div>
  </div>
</div>
