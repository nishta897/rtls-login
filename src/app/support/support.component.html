<div class="support-container">
  <h2>Support</h2>
  <p>If you need assistance, you can reach our support team via the following options:</p>

  <div class="support-options">
    <button> Email: {{ supportEmail }}</button>
    <button > Phone: {{ supportPhone }}</button>
  </div>

  <p class="info-note">Support is available Monday to Friday, 9:00 AM to 6:00 PM (EST).</p>

  <div class="back-to-dashboard">
    <button (click)="goToDashboard()">Back to Dashboard</button>
  </div>
</div>
